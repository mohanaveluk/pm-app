<h2 mat-dialog-title class="dlg-title">
  <mat-icon [color]="data.color === 'warn' ? 'warn' : undefined">{{ data.icon ?? 'help_outline' }}</mat-icon>
  {{ data.title }}
</h2>

<mat-dialog-content>
  <p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">{{ data.cancelText ?? 'Cancel' }}</button>
  <button mat-raised-button type="button" [color]="data.color ?? 'primary'" (click)="confirm()">
    {{ data.confirmText ?? 'Confirm' }}
  </button>
</mat-dialog-actions>
