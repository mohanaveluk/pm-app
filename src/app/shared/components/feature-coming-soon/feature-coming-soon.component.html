<div class="coming-soon">
  <mat-card class="coming-soon__card">
    <mat-icon class="coming-soon__icon">{{ icon() }}</mat-icon>
    <h2>{{ title() }}</h2>
    <p>{{ description() }}</p>
    <a mat-flat-button color="primary" routerLink="/dashboard">
      <mat-icon>arrow_back</mat-icon>
      Back to Dashboard
    </a>
  </mat-card>
</div>
