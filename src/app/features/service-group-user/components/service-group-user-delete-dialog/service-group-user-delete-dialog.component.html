<h2 mat-dialog-title class="dlg-title dlg-title--warn">
  <mat-icon>warning</mat-icon>
  Remove User from Service Group
</h2>

<mat-dialog-content>
  <p>
    Remove <strong>{{ data.assignment.userFullName }}</strong> from
    <strong>{{ data.assignment.serviceGroupName }}</strong>?
  </p>
  <p class="dlg-hint">
    This revokes all Activities and Permissions inherited from this Service Group. This action can be undone by
    re-assigning the user later.
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-raised-button color="warn" type="button" (click)="confirm()">Remove</button>
</mat-dialog-actions>
