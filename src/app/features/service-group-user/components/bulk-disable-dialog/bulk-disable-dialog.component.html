<h2 mat-dialog-title class="dlg-title dlg-title--warn">
  <mat-icon>toggle_off</mat-icon>
  Bulk Disable Assignments
</h2>

<mat-dialog-content>
  <p>Disable <strong>{{ data.count }}</strong> selected assignment(s)? Affected users will immediately lose access to the Activities and Permissions granted by their Service Group(s).</p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-raised-button color="warn" type="button" (click)="confirm()">Disable</button>
</mat-dialog-actions>
