<h2 mat-dialog-title class="dlg-title">
  <mat-icon color="warn">warning</mat-icon>
  Delete WBS?
</h2>

<mat-dialog-content>
  <p>
    WBS <strong>"{{ data.wbsCostCode.projectDetails }}"</strong> ({{ data.wbsCostCode.code }})
    will be removed from active master data.
  </p>
  <p class="dlg-note">
    This performs a soft delete — the record is retained for audit purposes and can be
    restored if needed, but it will no longer appear in the active list.
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-raised-button color="warn" type="button" (click)="confirm()">
    <mat-icon>delete</mat-icon>
    Delete
  </button>
</mat-dialog-actions>
