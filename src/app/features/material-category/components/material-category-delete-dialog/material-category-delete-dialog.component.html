<h2 mat-dialog-title class="dlg-title">
  <mat-icon color="warn">warning</mat-icon>
  Delete Material Category?
</h2>

<mat-dialog-content>
  <p>
    Are you sure you want to delete
    <strong>"{{ data.materialCategory.name }}"</strong>?
  </p>
  <p class="dlg-note">
    This record will be soft-deleted and will no longer be available for normal selection.
  </p>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button type="button" (click)="cancel()">Cancel</button>
  <button mat-raised-button color="warn" type="button" (click)="confirm()">
    <mat-icon>delete</mat-icon>
    Delete
  </button>
</mat-dialog-actions>
