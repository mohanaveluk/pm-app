<div class="panel-actions">
  <mat-form-field appearance="outline" subscriptSizing="dynamic" style="flex: 1 1 300px; min-width: 220px">
    <mat-label>Search by code or description…</mat-label>
    <mat-icon matPrefix>search</mat-icon>
    <input matInput [value]="search()" (input)="onSearch($event)" aria-label="Search materials" />
    @if (search()) {
      <button matSuffix mat-icon-button type="button" aria-label="Clear search" (click)="clearSearch()">
        <mat-icon>close</mat-icon>
      </button>
    }
  </mat-form-field>

  @if (hasReferenceQuantities()) {
    <button mat-stroked-button type="button" (click)="useReferenceQuantities()">
      <mat-icon>content_copy</mat-icon> Use {{ referenceLabel() || 'reference' }} quantities
    </button>
  }

  <span class="mr-muted">{{ matches().length }} material{{ matches().length === 1 ? '' : 's' }}</span>
</div>

<app-requisition-items-table
  [rows]="page()"
  [source]="source()"
  [sourceReference]="sourceReference()"
  [referenceLabel]="referenceLabel()"
  [emptyMessage]="emptyMessage()"
/>

<mat-paginator
  [length]="matches().length"
  [pageIndex]="pageIndex()"
  [pageSize]="pageSize()"
  [pageSizeOptions]="[10, 25, 50]"
  (page)="onPage($event)"
></mat-paginator>
